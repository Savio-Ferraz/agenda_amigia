<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | Amigia Educação</title>
  
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/x-icon" href="logo.png">

  <!-- Tailwind CSS & Fontes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .amigia-gradient {
      background: linear-gradient(135deg, #f43f5e 0%, #f59e0b 50%, #2563eb 100%);
    }
  
/* CABECALHO COMPACTO AMIGIA */
#appHeader {
  display: grid !important;
  grid-template-columns: minmax(280px, 1fr) auto;
  align-items: center;
  gap: 8px 24px !important;
  padding: 10px 24px !important;
  min-height: auto;
}

#appHeader > div:nth-child(1) {
  grid-column: 1;
  grid-row: 1;
}

#appHeader > div:nth-child(2) {
  grid-column: 2;
  grid-row: 1;
  justify-content: flex-end;
}

#appHeader > div:nth-child(3) {
  grid-column: 1 / -1;
  grid-row: 2;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px !important;
  width: 100%;
}

#appHeader > div:nth-child(3) > div:nth-child(3) {
  margin-left: auto;
}

#appHeader h1 {
  margin: 0;
}

#appHeader button,
#appHeader a {
  white-space: nowrap;
}

@media (max-width: 1150px) {
  #appHeader {
    grid-template-columns: 1fr;
    gap: 10px !important;
  }

  #appHeader > div:nth-child(1),
  #appHeader > div:nth-child(2),
  #appHeader > div:nth-child(3) {
    grid-column: 1;
    grid-row: auto;
  }

  #appHeader > div:nth-child(2) {
    justify-content: flex-start;
  }

  #appHeader > div:nth-child(3) > div:nth-child(3) {
    margin-left: 0;
  }
}

</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col overflow-hidden antialiased">
  <div id="loginScreen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
      <img src="logo.png" alt="Amigia" class="w-16 h-16 object-contain mx-auto mb-4">
      <h2 class="text-2xl font-extrabold text-slate-900 text-center">Agenda Amigia</h2>
      <p id="loginHelp" class="text-sm text-slate-500 text-center mb-6 mt-2">Entre com sua conta autorizada de Diretor ou Colaborador.</p>
      <form id="loginForm" class="space-y-4">
        <label class="block text-sm font-semibold">E-mail<input id="loginEmail" type="email" autocomplete="username" required class="block w-full mt-1 p-3 rounded-xl border border-slate-300"></label>
        <label class="block text-sm font-semibold">Senha<input id="loginPassword" type="password" autocomplete="current-password" required class="block w-full mt-1 p-3 rounded-xl border border-slate-300"></label>
        <p id="loginError" role="alert" class="text-sm text-rose-600" aria-live="polite"></p>
        <button id="loginButton" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">Entrar na Agenda</button>
      </form>
    </div>
  </div>

  <!-- BARRA DE BRANDING NO TOPO -->
  <div class="h-1 w-full amigia-gradient z-30"></div>

  <!-- TOP HEADER / NAVBAR -->
  <header id="appHeader" class="bg-white border-b border-slate-200/80 px-6 py-3 flex flex-col gap-3 shadow-xs shrink-0 z-20">
    <!-- LOGO & TÍTULO -->
    <div class="flex items-center gap-3.5">
      <div class="w-10 h-10 rounded-2xl bg-slate-100 border border-slate-200/60 flex items-center justify-center overflow-hidden shrink-0 shadow-xs">
        <img src="logo.png" alt="Amigia Logo" class="w-full h-full object-contain p-1" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full rounded-2xl flex items-center justify-center amigia-gradient\'><i class=\'fa-solid fa-heart text-white text-base\'></i></div>';">
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-slate-900 flex items-center gap-2">
          Agenda Amigia 
          <span class="bg-blue-50 text-blue-700 border border-blue-200/60 text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full font-bold">Educação</span>
        </h1>
        <p class="text-xs text-slate-500 font-medium">Gestão Integrada de Atendimentos & Agenda Pedagógica</p>
      </div>
    </div>

    <!-- LINHA 1 - CONTROLES DE NAVEGAÇÃO TEMPORAL -->
    <div class="flex flex-wrap items-center gap-3">
      <button id="btnToday" onclick="goToToday()" class="px-3.5 py-1.5 border border-slate-300/80 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100/80 active:scale-95 transition shadow-xs">Hoje</button>
      <div class="flex items-center bg-slate-100/80 rounded-xl p-0.5 border border-slate-200/80">
        <button id="btnPrev" onclick="navigatePeriod(-1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-xs rounded-lg transition active:scale-90"><i class="fa-solid fa-chevron-left text-xs"></i></button>
        <button id="btnNext" onclick="navigatePeriod(1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-white hover:shadow-xs rounded-lg transition active:scale-90"><i class="fa-solid fa-chevron-right text-xs"></i></button>
      </div>
      <h2 id="currentPeriodTitle" class="text-base font-bold text-slate-800 min-w-[190px] tracking-tight">---</h2>
    </div>

    <!-- LINHA 2 - VISUALIZAÇÕES E AÇÕES -->
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-50 border border-blue-200 p-1 rounded-xl">
        <label for="agendaFilter" class="text-xs font-semibold text-slate-600 px-2">Visualizar:</label>
        <select id="agendaFilter" onchange="renderCurrentView()" class="bg-white rounded-lg px-3 py-2 text-xs font-bold border border-slate-200">
          <option value="all">Todas as agendas</option><option value="savio">Agenda de Savio</option><option value="lucas">Agenda de Lucas</option>
        </select>
      </div>
      <div class="bg-slate-100/80 p-1 rounded-xl border border-slate-200/80 flex text-xs font-semibold">
        <button data-view="month" onclick="switchView('month')" class="view-btn px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-600 font-bold transition">Mês</button>
        <button data-view="week" onclick="switchView('week')" class="view-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">Semana</button>
        <button data-view="day" onclick="switchView('day')" class="view-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">Dia</button>
        <button data-view="agenda" onclick="switchView('agenda')" class="view-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">Lista</button>
      </div>

      <a href="https://savio-ferraz.github.io/CRM-Amigia_Educacao/" target="_blank" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200/80 text-slate-700 border border-slate-200/80 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
        <i class="fa-solid fa-chart-line text-blue-600"></i>
        <span>Ir para CRM</span>
      </a>

      <div class="flex items-center gap-2 bg-slate-100/80 px-3 py-1.5 rounded-xl border border-slate-200/80 focus-within:ring-2 focus-within:ring-blue-500/20 transition">
        <i class="fa-solid fa-user-circle text-slate-400 text-sm"></i>
        <input type="text" id="globalUserName" placeholder="Seu Nome..." class="bg-transparent text-xs font-semibold text-slate-700 focus:outline-none w-28 placeholder:font-normal placeholder:text-slate-400">
      </div>

      <span id="userRoleIndicator" class="text-xs font-bold text-slate-600"></span>
      <button id="btnRequests" onclick="openRequestsPanel()" class="hidden px-3.5 py-2 bg-amber-100 text-amber-900 rounded-xl text-xs font-bold">Solicitações <span id="pendingCount"></span></button>
      <button id="btnSignOut" onclick="signOutAgenda()" class="hidden px-3.5 py-2 border border-slate-300 rounded-xl text-xs font-bold">Sair</button>
      <button id="btnNewEvent" onclick="openNewEventModal()" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-xs hover:shadow-md transition flex items-center gap-2">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>Novo Agendamento</span>
      </button>
    </div>
  </header>

  <!-- PAINEL PRINCIPAL -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- BARRA LATERAL -->
    <aside class="w-72 bg-white border-r border-slate-200/80 p-4 flex flex-col gap-5 shrink-0 overflow-y-auto">
      <!-- MINI CALENDÁRIO -->
      <div class="bg-slate-50/80 p-3.5 rounded-2xl border border-slate-200/60">
        <div class="flex items-center justify-between mb-3 px-1">
          <span id="miniMonthTitle" class="font-bold text-xs text-slate-800 tracking-wide uppercase"></span>
          <div class="flex gap-1">
            <button id="miniPrev" onclick="navigateMiniMonth(-1)" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
            <button id="miniNext" onclick="navigateMiniMonth(1)" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
          </div>
        </div>
        <div class="calendar-grid text-center text-[10px] text-slate-400 font-bold mb-2">
          <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
        </div>
        <div id="miniCalendarDays" class="calendar-grid text-xs gap-y-1"></div>
      </div>

      <!-- CAMPO DE BUSCA -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="renderCurrentView()" placeholder="Buscar compromisso ou responsável..." class="w-full bg-slate-50 border border-slate-200/80 rounded-xl pl-8 pr-3 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
      </div>

      <!-- FILTROS DE CATEGORIA -->
      <div>
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2.5 px-1">Categorias</h3>
        <div class="space-y-1" id="categoryFilters">
          <label class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer p-2 rounded-xl hover:bg-slate-50 transition">
            <input type="checkbox" value="all" checked onchange="toggleAllFilters(this)" class="rounded text-blue-600 focus:ring-blue-500/20 filter-checkbox">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <span class="font-semibold text-slate-800">Todas as Categorias</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer p-2 rounded-xl hover:bg-slate-50 transition">
            <input type="checkbox" value="Atendimento" checked onchange="renderCurrentView()" class="rounded text-blue-600 focus:ring-blue-500/20 filter-checkbox">
            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
            <span class="font-medium">Atendimento Pedagógico</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer p-2 rounded-xl hover:bg-slate-50 transition">
            <input type="checkbox" value="Reunião" checked onchange="renderCurrentView()" class="rounded text-blue-600 focus:ring-blue-500/20 filter-checkbox">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            <span class="font-medium">Reunião de Pais / Equipe</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer p-2 rounded-xl hover:bg-slate-50 transition">
            <input type="checkbox" value="Aula/Atividade" checked onchange="renderCurrentView()" class="rounded text-blue-600 focus:ring-blue-500/20 filter-checkbox">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span class="font-medium">Aula / Atividade</span>
          </label>
          <label class="flex items-center gap-2.5 text-xs text-slate-700 cursor-pointer p-2 rounded-xl hover:bg-slate-50 transition">
            <input type="checkbox" value="Outros" checked onchange="renderCurrentView()" class="rounded text-blue-600 focus:ring-blue-500/20 filter-checkbox">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
            <span class="font-medium">Outros</span>
          </label>
        </div>
      </div>
    </aside>

    <!-- ÁREA CENTRAL DO CALENDÁRIO -->
    <main class="flex-1 bg-white flex flex-col overflow-hidden relative" id="calendarMain">
      <div id="viewContainer" class="h-full w-full overflow-y-auto"></div>
    </main>
  </div>

  <!-- MODAL DE FORMULÁRIO -->
  <div id="eventModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 hidden transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-lg p-6 relative scale-100 transition-all">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-slate-100 transition"><i class="fa-solid fa-xmark text-base"></i></button>
      
      <h3 id="modalTitle" class="text-lg font-bold text-slate-900 mb-5 flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-calendar-plus text-sm"></i></div>
        <span>Agendar Compromisso</span>
      </h3>

      <form id="eventForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="eventId">
        
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Título do Compromisso *</label>
          <input type="text" id="inputTitle" required placeholder="Ex: Reunião Pedagógica com Direção" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Data *</label>
            <input type="date" id="inputDate" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Início *</label>
            <input type="time" id="inputStartTime" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Fim *</label>
            <input type="time" id="inputEndTime" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
          </div>
        </div>

        <div>
          <label for="inputAgendaOwner" class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Agenda de destino *</label>
          <select id="inputAgendaOwner" required class="w-full bg-blue-50 border border-blue-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold">
            <option value="savio">Agenda de Savio Ferraz</option><option value="lucas">Agenda de Lucas Silva</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Responsável *</label>
            <input type="text" id="inputCreatedBy" required placeholder="Seu Nome" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Categoria *</label>
            <select id="inputCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition">
              <option value="Atendimento">Atendimento Pedagógico</option>
              <option value="Reunião">Reunião de Pais / Equipe</option>
              <option value="Aula/Atividade">Aula / Atividade</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Observações / Detalhes</label>
          <textarea id="inputDescription" rows="3" placeholder="Pauta da reunião, detalhes da escola ou observações..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition"></textarea>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-slate-100">
          <button type="button" id="btnDeleteEvent" onclick="deleteCurrentEvent()" class="text-rose-600 hover:bg-rose-50 border border-transparent hover:border-rose-200 px-3.5 py-2 rounded-xl text-xs font-bold transition hidden">
            <i class="fa-solid fa-trash mr-1.5"></i> Excluir
          </button>
          <div class="flex items-center gap-2 ml-auto">
            <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold text-xs px-5 py-2 rounded-xl shadow-xs transition">Salvar Compromisso</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE DETALHES -->
  <div id="detailsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 hidden transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 w-full max-w-md p-6 relative">
      <button onclick="closeDetailsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-slate-100 transition"><i class="fa-solid fa-xmark text-base"></i></button>
      
      <span id="detailCategoryBadge" class="text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider mb-3 inline-block"></span>
      <h3 id="detailTitle" class="text-lg font-bold text-slate-900 mb-4 leading-snug"></h3>
      
      <div class="space-y-3 text-xs text-slate-600 mb-6 bg-slate-50/80 p-4 rounded-2xl border border-slate-200/60">
        <div class="flex flex-wrap items-center gap-3"><i class="fa-regular fa-calendar text-slate-400 w-4 text-center"></i><span id="detailDate" class="font-semibold text-slate-700"></span></div>
        <div class="flex flex-wrap items-center gap-3"><i class="fa-regular fa-clock text-slate-400 w-4 text-center"></i><span id="detailTime" class="font-semibold text-slate-700"></span></div>
        <div class="flex flex-wrap items-center gap-3"><i class="fa-solid fa-user-circle text-blue-600 w-4 text-center"></i><div><span class="text-[10px] text-slate-400 block font-bold uppercase">Agendado por:</span><span id="detailCreatedBy" class="font-bold text-slate-800"></span></div></div>
        <div id="detailDescContainer" class="pt-2 border-t border-slate-200/60"><span class="text-[10px] text-slate-400 block mb-1 font-bold uppercase">Observações:</span><p id="detailDescription" class="text-xs bg-white p-3 rounded-xl border border-slate-200/60 text-slate-700 whitespace-pre-wrap leading-relaxed"></p></div>
      </div>

      <div class="flex justify-end gap-2">
        <button id="btnDeleteFromDetails" onclick="deleteFromDetails()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-trash mr-1.5"></i> Excluir</button>
        <button id="btnEditFromDetails" onclick="editFromDetails()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"><i class="fa-solid fa-pen-to-square mr-1.5"></i> Editar</button>
      </div>
    </div>
  </div>

  <div id="requestsPanel" class="hidden fixed inset-0 z-[70] bg-slate-900/60 p-4 flex items-center justify-center">
    <section class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[85vh] overflow-y-auto p-6" aria-label="Solicitações">
      <div class="flex items-center justify-between mb-4"><h2 class="text-xl font-extrabold">Solicitações de compromissos</h2><button onclick="closeRequestsPanel()" class="px-3 py-1 rounded-lg bg-slate-100">Fechar</button></div>
      <div class="flex flex-wrap gap-2 mb-4" role="group" aria-label="Filtrar solicitações">
        <button id="requestsPendingTab" onclick="setRequestsTab('pendente')" class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white">Pendentes</button>

  </div>
  <!-- LÓGICA JAVASCRIPT INTEGRADA COM DETECÇÃO AUTOMÁTICA DE URL (CRM) -->
  <script>
    // Configuração do Firebase Realtime Database
    const firebaseConfig = {

      messagingSenderId: "886282109249",

    let db = null, auth = null, eventsRef = null, currentUser = null, currentUserRole = null;

    const DIRECTOR_UID = 'dI1GVPYB4AZbRO6ZFDskCsL5uFv1';

    function updateAgendaLabels() {

    // Sem campo de destino em registros antigos: mostram na agenda Savio, sem migrar nem apagar.

      if (currentUserRole !== 'Diretor') { lucasUid = currentUser.uid; return; }
      const snap = await db.ref('usuarios').once('value');

      if (found) lucasUid = found[0];
      else {
        const collaborators = Object.entries(members).filter(([uid, u]) => uid !== DIRECTOR_UID && u?.role === 'Colaborador');
        if (collaborators.length === 1) lucasUid = collaborators[0][0];

      if (!lucasUid) throw new Error('Lucas não encontrado em /usuarios. Não é possível gravar na agenda dele.');
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();

      db = firebase.database();

      eventsRef = db.ref('compromissos');
      requestsRef = db.ref('solicitacoes_compromissos');
    } catch (error) { console.error('Falha ao iniciar Firebase:', error); }

    let events = [];
    let currentDate = new Date();
    let selectedMiniDate = new Date();
    let currentView = 'month';
    let currentActiveEvent = null;

    const categoryStyles = {
      'Atendimento': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-500', badgeBg: 'bg-blue-100' },
      'Reunião': { bg: 'bg-amber-50', text: 'text-amber-800', border: 'border-amber-500', badgeBg: 'bg-amber-100' },
      'Aula/Atividade': { bg: 'bg-emerald-50', text: 'text-emerald-800', border: 'border-emerald-500', badgeBg: 'bg-emerald-100' },
      'Outros': { bg: 'bg-purple-50', text: 'text-purple-800', border: 'border-purple-500', badgeBg: 'bg-purple-100' }
    };

    const viewContainer = document.getElementById('viewContainer');
    const currentPeriodTitle = document.getElementById('currentPeriodTitle');
    const miniMonthTitle = document.getElementById('miniMonthTitle');
    const miniCalendarDays = document.getElementById('miniCalendarDays');
    const globalUserNameInput = document.getElementById('globalUserName');

    // Inicialização do aplicativo
    window.addEventListener('DOMContentLoaded', () => {
      globalUserNameInput.value = '';
      globalUserNameInput.addEventListener('input', () => {});
      
      localStorage.removeItem('amigia_events');
      document.getElementById('loginForm').addEventListener('submit', loginAgenda);
      if (auth) auth.onAuthStateChanged(handleAuthChange);
      else setLoginError('Firebase indisponível. Tente recarregar a página.');

      // Fechar Modais com a Tecla ESC
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
          closeDetailsModal();

      // CAPTURA AUTOMÁTICA DE PARÂMETROS VINDA DO CRM
      const urlParams = new URLSearchParams(window.location.search);
      const titleParam = urlParams.get('title');
      const categoryParam = urlParams.get('category');

      // Parâmetros do CRM só abrem o formulário após a autenticação.
      window.crmDraft = titleParam ? { title: titleParam, category: categoryParam } : null;
    });

    function formatDate(date) {
      const d = new Date(date);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getStartOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = d.getDate() - day;
      return new Date(d.setDate(diff));
    }

    // Segurança: a interface não é fonte de autorização. As regras do Realtime Database prevalecem.
    const allowedFields = ['title','date','startTime','endTime','category','description'];
    // Snapshot canônico dos dados: exige ausência de modificações entre pedido e aprovação.
    function snapshotEvent(ev) {
      const data = { ...ev };
      delete data.id;
      return JSON.stringify(Object.fromEntries(Object.entries(data).sort(([a],[b]) => a.localeCompare(b))));
    }
    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function setLoginError(message) { document.getElementById('loginError').textContent = message || ''; }
    async function loginAgenda(e) {
      e.preventDefault();
      setLoginError('');
      const button = document.getElementById('loginButton');
      button.disabled = true;
      button.textContent = 'Autenticando...';
      try {
        await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
        document.getElementById('loginPassword').value = '';
      } catch (err) {
        console.error('Erro ao entrar:', err.code);
        setLoginError('Não foi possível entrar. Confira seu e-mail e senha.');
      } finally { button.disabled = false; button.textContent = 'Entrar na Agenda'; }
    }
    function clearUserData() {
      if (eventsRef) eventsRef.off('value');
      if (requestsListenerQuery) requestsListenerQuery.off('value');
      requestsListenerQuery = null;
      events = []; requests = {}; currentActiveEvent = null;
      localStorage.removeItem('amigia_events');
      document.getElementById('btnRequests').classList.add('hidden');
      document.getElementById('btnSignOut').classList.add('hidden');
      document.getElementById('userRoleIndicator').textContent = '';
      closeModal(); closeDetailsModal(); closeRequestsPanel();
      renderCurrentView();
    }
    async function handleAuthChange(user) {
      const generation = ++authGeneration;
      clearUserData();
      currentUser = null; currentUserRole = null;
      document.getElementById('loginScreen').classList.remove('hidden');
      if (!user) return;
      document.getElementById('loginHelp').textContent = 'Verificando suas permissões...';
      try {
        const snap = await db.ref('usuarios/' + user.uid + '/role').once('value');
        if (generation !== authGeneration || auth.currentUser?.uid !== user.uid) return;
        const role = snap.val();
        if (role !== 'Diretor' && role !== 'Colaborador') {
          setLoginError('Sua conta ainda não possui acesso à Agenda.');
          await auth.signOut();
          return;
        }
        currentUser = user; currentUserRole = role;
        document.getElementById('loginHelp').textContent = 'Entre com sua conta autorizada.';
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('btnSignOut').classList.remove('hidden');
        // Recuperação: aprovação desativada até validar regras de produção.
        document.getElementById('userRoleIndicator').textContent = role;
        globalUserNameInput.value = role === 'Diretor' ? 'Savio Ferraz' : 'Lucas Silva';
        globalUserNameInput.readOnly = true;
        updateAgendaLabels();
        try { await discoverLucasUid(); } catch(err) { console.warn(err.message); }
        document.getElementById('btnRequests').classList.remove('hidden');
        initDataSync();
        initRequestsSync();
        if (window.crmDraft) {
          openNewEventModal();
          document.getElementById('inputTitle').value = window.crmDraft.title;
          if (window.crmDraft.category) document.getElementById('inputCategory').value = window.crmDraft.category;
          window.crmDraft = null;
        }
      } catch (err) {
        console.error('Erro ao conferir perfil:',err);
        setLoginError('Não foi possível validar seu perfil. Confira as regras do Firebase.');
        await auth.signOut();
      }
    }
    async function signOutAgenda() { if (auth) await auth.signOut(); }
    function requireSession() {
      if (!currentUser || !currentUserRole || auth.currentUser?.uid !== currentUser.uid) throw new Error('Entre na Agenda para continuar.');
    }
    function initDataSync() {
      requireSession();
      eventsRef.on('value', snap => {
        if (!currentUserRole) return;
        const data = snap.val() || {};
        events = Object.entries(data).filter(([,v])=>v && typeof v === 'object').map(([id,v])=>({ ...v, id }));
        renderCurrentView();
      }, err => { events = []; renderCurrentView(); alert('Não foi possível carregar os compromissos: ' + err.message); });
    }
    function initRequestsSync() {
      requireSession();
      requestsListenerQuery = currentUserRole === 'Diretor' ? requestsRef : requestsRef.orderByChild('solicitanteUid').equalTo(currentUser.uid);
      requestsListenerQuery.on('value', snap => {
        if (!currentUserRole) return;
        requests = snap.val() || {};
        document.getElementById('pendingCount').textContent = '(' + Object.values(requests).filter(r=>r.status==='pendente').length + ')';
        if (!document.getElementById('requestsPanel').classList.contains('hidden')) renderRequests();
      }, err => console.error('Falha ao carregar solicitações:', err));
    }
    async function saveEventToStorage(eventData, id = null) {
      requireSession();
      if (id && currentUserRole === 'Colaborador') {
        await createRequest(id, 'editar', eventData);
      } else if (id) {
        await eventsRef.child(id).update(eventData);
      } else {
        const dest = document.getElementById('inputAgendaOwner').value;
        const targetUid = ownerUid(dest);
        if (!targetUid) throw new Error('Agenda do Lucas indisponível: confira o cadastro dele no Firebase.');
        await eventsRef.push().set({ ...eventData, createdByUid: currentUser.uid, agendaOwnerUid: targetUid });
      }
    }
    async function deleteEventFromStorage(id) {
      requireSession();
      if (currentUserRole === 'Colaborador') await createRequest(id, 'excluir');
      else await eventsRef.child(id).remove();
    }
    async function createRequest(id, type, proposed = null) {
      const original = events.find(e=>e.id===id);
      if (!original) throw new Error('Compromisso não encontrado.');
      const reason = prompt('Informe o motivo da solicitação:');
      if (reason === null) throw new Error('Solicitação cancelada.');
      if (!reason.trim()) throw new Error('O motivo é obrigatório.');
      const payload = {
        solicitanteUid: currentUser.uid, compromissoId: id, tipo: type,
        status: 'pendente', motivo: reason.trim(), criadoEm: firebase.database.ServerValue.TIMESTAMP,
        versaoOriginal: snapshotEvent(original)
      };
      if (type === 'editar') {
        payload.alteracoes = {};
        for (const f of allowedFields) if (proposed[f] !== original[f]) payload.alteracoes[f] = proposed[f];
        if (!Object.keys(payload.alteracoes).length) throw new Error('Nenhuma alteração foi feita.');
      }
      await requestsRef.push().set(payload);
      alert('Sua solicitação foi enviada ao Diretor.');
    }
    function openRequestsPanel() { if (!currentUserRole) return; requestsTab = 'pendente'; document.getElementById('requestsPanel').classList.remove('hidden'); renderRequests(); }
    function closeRequestsPanel() { document.getElementById('requestsPanel').classList.add('hidden'); }
    function setRequestsTab(tab) { requestsTab = tab; renderRequests(); }
    const changeFieldLabels = {title:'Título',date:'Data',startTime:'Horário inicial',endTime:'Horário final',category:'Categoria',description:'Observações',agendaOwnerUid:'Agenda de destino',createdBy:'Criado por'};
    function displayChangeValue(key, value) {
      if (key === 'agendaOwnerUid') return value === DIRECTOR_UID ? 'Agenda de Savio' : (value === lucasUid ? 'Agenda de Lucas' : 'Outra agenda');
      if (value === null || value === undefined || value === '') return '(vazio)';
      return String(value);
    }
    function renderRequests() {
      const list = document.getElementById('requestsList');
      const all = Object.entries(requests).sort((a,b)=>(b[1].criadoEm||0)-(a[1].criadoEm||0));
      const pending = all.filter(([,r])=>r.status==='pendente');
      const entries = all.filter(([,r])=>requestsTab === 'pendente' ? r.status==='pendente' : r.status!=='pendente');
      for (const [tab,id] of [['pendente','requestsPendingTab'],['historico','requestsHistoryTab']]) {
        const btn = document.getElementById(id);
        btn.className = 'px-4 py-2 rounded-lg text-sm font-semibold ' + (tab===requestsTab ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700');
        btn.textContent = tab==='pendente' ? `Pendentes (${pending.length})` : `Histórico (${all.length-pending.length})`;
      }
      document.getElementById('requestsSummary').textContent = requestsTab === 'pendente' ? 'Pedidos aguardando decisão do Diretor' : 'Pedidos já aprovados ou rejeitados';
      list.innerHTML = '';
      if (!entries.length) { list.innerHTML = '<p class="text-sm text-slate-500 bg-slate-50 rounded-xl p-5">Nenhuma solicitação nesta categoria.</p>'; return; }
      for (const [id,req] of entries) {
        const card = document.createElement('article');
        card.className = 'rounded-xl border border-slate-200 p-4 bg-white shadow-sm space-y-2';
        const current = events.find(e=>e.id===req.compromissoId);
        const time = Number.isFinite(req.criadoEm) ? new Date(req.criadoEm).toLocaleString('pt-BR') : '-';
        const statusLabel = {pendente:'Aguardando aprovação',processando:'Em processamento',aprovado:'Aprovado',rejeitado:'Rejeitado'}[req.status] || 'Status desconhecido';
        const statusClass = {pendente:'bg-amber-50 text-amber-800',processando:'bg-blue-50 text-blue-800',aprovado:'bg-emerald-50 text-emerald-800',rejeitado:'bg-rose-50 text-rose-800'}[req.status] || 'bg-slate-100 text-slate-700';
        const title = current?.title || req.tituloOriginal || 'Compromisso original não disponível';
        const changes = Object.entries(req.alteracoes || {}).map(([field,value])=>`<div class="flex gap-3 py-1.5 border-b border-slate-100 last:border-0"><span class="text-slate-500 w-32 shrink-0">${escapeHTML(changeFieldLabels[field] || field)}</span><span class="font-semibold text-slate-800 break-words">${escapeHTML(displayChangeValue(field,value))}</span></div>`).join('');
        const legacyNotice = req.status==='pendente' && !req.versaoOriginal ? '<p class="text-xs text-amber-800 bg-amber-50 rounded-lg p-3">Solicitação antiga sem verificação de versão. Não é seguro aprová-la; rejeite e peça uma nova solicitação.</p>' : '';
        card.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-2"><span class="text-xs font-bold uppercase tracking-wide text-slate-500">${req.tipo==='editar'?'Solicitação de alteração':'Solicitação de exclusão'}</span><span class="rounded-full px-3 py-1 text-xs font-semibold ${statusClass}">${escapeHTML(statusLabel)}</span></div><h3 class="font-bold text-slate-900 text-base">${escapeHTML(title)}</h3><p class="text-xs text-slate-500">${escapeHTML(time)}</p><p class="text-sm text-slate-700"><strong>Motivo:</strong> ${escapeHTML(req.motivo || 'Não informado')}</p>${req.tipo==='editar' ? `<div class="bg-slate-50 rounded-lg p-3"><p class="font-semibold text-xs text-slate-500 mb-1">Alterações solicitadas</p>${changes || '<p class="text-sm text-slate-500">Nenhuma alteração informada.</p>'}</div>` : ''}${legacyNotice}`;
        if (currentUserRole === 'Diretor' && req.status === 'pendente') {
          const actions = document.createElement('div'); actions.className = 'flex flex-wrap gap-2 pt-2';
          const choices = req.versaoOriginal ? [['aprovado','Aprovar','bg-emerald-600'],['rejeitado','Rejeitar','bg-rose-600']] : [['rejeitado','Rejeitar pedido antigo','bg-rose-600']];
          for (const [decision, caption, klass] of choices) {
            const btn = document.createElement('button'); btn.textContent = caption;
            btn.className = `${klass} text-white rounded-lg py-2 px-4 text-xs font-bold`;
            btn.onclick = async () => {
              if (!confirm(caption + ' esta solicitação? Verifique o compromisso atual antes de confirmar.')) return;
              btn.disabled = true;
              try { await decideRequest(id, decision); alert('Solicitação processada.'); }
              catch (e) { alert('Não foi possível processar: ' + e.message); }
              finally { btn.disabled = false; }
            };
            actions.appendChild(btn);
          }
          card.appendChild(actions);
        }
        list.appendChild(card);
      }
    }
    // Controle de decisão concorrente: apenas uma aba pode assumir o pedido.
    // O lock é transacional por solicitação. A finalização multipath é atômica.
    // Limite: não equivale a CAS entre caminhos diferentes para edições externas.
    async function decideRequest(id, decision) {
      requireSession();
      if (currentUserRole !== 'Diretor') throw new Error('Apenas o Diretor pode decidir.');
      if (!['aprovado','rejeitado'].includes(decision)) throw new Error('Decisão inválida.');
      const requestRef = requestsRef.child(id);
      const claimToken = currentUser.uid + '_' + db.ref().push().key;
      // Firebase transaction pode repetir o callback: sem efeitos colaterais.
      const claimed = await requestRef.transaction(value => {
        if (!value || value.status !== 'pendente') return;
        return {...value, status: 'processando', processamentoToken: claimToken};
      }, undefined, false);
      if (!claimed.committed) throw new Error('Solicitação já está sendo processada ou foi decidida. Atualize a tela.');
      let finalized = false;
      try {
        const req = claimed.snapshot.val();
        if (!req || req.processamentoToken !== claimToken) throw new Error('Não foi possível obter o bloqueio exclusivo.');
        if (!['editar','excluir'].includes(req.tipo) || typeof req.compromissoId !== 'string' || !req.compromissoId) throw new Error('Solicitação inválida.');
        const evRef = eventsRef.child(req.compromissoId);
        const currentEvent = (await evRef.once('value')).val();
        const updates = {};
        if (decision === 'aprovado') {
          if (!currentEvent || typeof req.versaoOriginal !== 'string' || req.versaoOriginal !== snapshotEvent(currentEvent))
            throw new Error('O compromisso mudou. Rejeite este pedido e solicite outro.');
          if (req.tipo === 'editar') {
            const changes = req.alteracoes;
            if (!changes || typeof changes !== 'object' || Array.isArray(changes) || !Object.keys(changes).length ||
                Object.keys(changes).some(k => !allowedFields.includes(k) || typeof changes[k] !== 'string'))
              throw new Error('Alterações inválidas.');
            if (Object.hasOwn(changes,'title') && !changes.title.trim()) throw new Error('Título vazio.');
            for (const [field,value] of Object.entries(changes)) updates[`compromissos/${req.compromissoId}/${field}`]=value;
          } else updates[`compromissos/${req.compromissoId}`]=null;
        }
        // Releitura após a preparação: protege contra alterações que já foram efetivadas.
        const latestEvent = (await evRef.once('value')).val();
        if (decision === 'aprovado' && (!latestEvent || snapshotEvent(latestEvent) !== req.versaoOriginal))
          throw new Error('O compromisso mudou durante a análise. Rejeite e solicite outro pedido.');
        const latestReq = (await requestRef.once('value')).val();
        if (!latestReq || latestReq.status !== 'processando' || latestReq.processamentoToken !== claimToken)
          throw new Error('A solicitação foi alterada durante a aprovação.');
        updates[`solicitacoes_compromissos/${id}/status`] = decision;
        updates[`solicitacoes_compromissos/${id}/processamentoToken`] = null;
        const auditId = db.ref('auditoria_solicitacoes').push().key;
        updates[`auditoria_solicitacoes/${auditId}`] = {
          solicitacaoId: id, compromissoId: req.compromissoId, tipo: req.tipo,
          decisao: decision, diretorUid: currentUser.uid, solicitanteUid: req.solicitanteUid,
          processadoEm: firebase.database.ServerValue.TIMESTAMP
        };
        await db.ref().update(updates);
        finalized = true;
      } catch (error) {
        // Solta o bloqueio apenas se ainda pertencer a esta operação.
        // Se houve falha de rede após commit, releitura impede desfazer decisão final.
        try {
          await requestRef.transaction(value => {
            if (!value || value.status !== 'processando' || value.processamentoToken !== claimToken) return;
            const restored = {...value, status:'pendente'};
            delete restored.processamentoToken;
            return restored;
          }, undefined, false);
        } catch (unlockError) {
          console.error('Não foi possível liberar solicitação em processamento:',unlockError);
          throw new Error(error.message + ' O pedido pode permanecer bloqueado; verifique o status antes de tentar novamente.');
        }
        throw error;
      }
      if (!finalized) throw new Error('Não foi possível concluir a decisão.');
    }

    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.view-btn').forEach(btn => {
        if (btn.dataset.view === view) {
          btn.className = 'view-btn px-3 py-1.5 rounded-lg bg-white shadow-xs text-blue-600 font-bold transition';
        } else {
          btn.className = 'view-btn px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      updatePeriodTitle();
      renderMiniCalendar();
      const filteredEvents = getFilteredEvents();

      if (currentView === 'month') renderMonthView(filteredEvents);
      else if (currentView === 'week') renderWeekView(filteredEvents);
      else if (currentView === 'day') renderDayView(filteredEvents);
      else if (currentView === 'agenda') renderAgendaView(filteredEvents);
    }

    function getFilteredEvents() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const checkedCategories = Array.from(document.querySelectorAll('.filter-checkbox:checked')).map(cb => cb.value);

      const chosenAgenda = document.getElementById('agendaFilter').value;
      return events.filter(e => {
        const matchesAgenda = chosenAgenda === 'all' || eventOwner(e) === chosenAgenda;
        const matchesCategory = checkedCategories.includes('all') || checkedCategories.includes(e.category);
        const matchesSearch = !searchTerm || 
          (e.title && e.title.toLowerCase().includes(searchTerm)) || 
          (e.createdBy && e.createdBy.toLowerCase().includes(searchTerm));
        return matchesAgenda && matchesCategory && matchesSearch;
      });
    }

    function toggleAllFilters(masterCb) {
      document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = masterCb.checked);
      renderCurrentView();
    }

    function updatePeriodTitle() {
      const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      if (currentView === 'month' || currentView === 'agenda') {
        currentPeriodTitle.textContent = `${months[currentDate.getMonth()]} de ${currentDate.getFullYear()}`;
      } else if (currentView === 'day') {
        currentPeriodTitle.textContent = `${currentDate.getDate()} de ${months[currentDate.getMonth()]} de ${currentDate.getFullYear()}`;
      } else if (currentView === 'week') {
        const startOfWeek = getStartOfWeek(currentDate);
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(endOfWeek.getDate() + 6);
        currentPeriodTitle.textContent = `${startOfWeek.getDate()} ${months[startOfWeek.getMonth()].substring(0,3)} - ${endOfWeek.getDate()} ${months[endOfWeek.getMonth()].substring(0,3)}`;
      }
    }

    function navigatePeriod(direction) {
      if (currentView === 'month' || currentView === 'agenda') currentDate.setMonth(currentDate.getMonth() + direction);
      else if (currentView === 'week') currentDate.setDate(currentDate.getDate() + (direction * 7));
      else if (currentView === 'day') currentDate.setDate(currentDate.getDate() + direction);
      renderCurrentView();
    }

    function goToToday() {
      currentDate = new Date();
      selectedMiniDate = new Date();
      renderCurrentView();
    }

    function renderMonthView(filteredEvents) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      let html = `<div class="h-full flex flex-col"><div class="grid grid-cols-7 border-b border-slate-200/80 bg-slate-50/80 text-center py-2 text-[11px] font-bold text-slate-500 uppercase tracking-wider"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div><div class="grid grid-cols-7 flex-1 auto-rows-fr bg-slate-200/60 gap-px overflow-y-auto">`;

      const todayStr = formatDate(new Date());

      for (let i = firstDayOfMonth - 1; i >= 0; i--) {
        html += `<div class="bg-slate-50/40 p-2 min-h-[90px] text-slate-300 text-xs font-semibold">${daysInPrevMonth - i}</div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = formatDate(new Date(year, month, day));
        const isToday = dateStr === todayStr;
        const dayEvents = filteredEvents.filter(e => e.date === dateStr).sort((a, b) => a.startTime.localeCompare(b.startTime));

        html += `<div class="bg-white p-2 min-h-[90px] flex flex-col hover:bg-slate-50/80 transition cursor-pointer group" onclick="openNewEventModal('${dateStr}')"><div class="flex items-center justify-between mb-1.5"><span class="w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${isToday ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-700'}">${day}</span><span class="text-[10px] text-blue-600 font-bold opacity-0 group-hover:opacity-100 transition">+ Agendar</span></div><div class="space-y-1 overflow-y-auto max-h-[85px]">`;

        dayEvents.forEach(ev => {
          const style = categoryStyles[ev.category] || categoryStyles['Outros'];
          html += `<div onclick="event.stopPropagation(); showEventDetails('${ev.id}')" class="${style.bg} ${style.text} border-l-4 ${style.border} rounded-md px-2 py-1 text-[11px] font-medium shadow-2xs hover:shadow-xs transition"><div class="font-bold truncate">${escapeHTML(ev.startTime)} ${escapeHTML(ev.title)}</div><div class="text-[9px] opacity-75 truncate"><i class="fa-solid fa-user text-[8px] mr-1"></i>${ev.createdBy || 'Anônimo'}</div></div>`;
        });

        html += `</div></div>`;
      }

      const totalCells = firstDayOfMonth + daysInMonth;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let day = 1; day <= nextDays; day++) html += `<div class="bg-slate-50/40 p-2 min-h-[90px] text-slate-300 text-xs font-semibold">${day}</div>`;

      html += `</div></div>`;
      viewContainer.innerHTML = html;
    }

    function renderWeekView(filteredEvents) {
      const startOfWeek = getStartOfWeek(currentDate);
      const weekDays = Array.from({length: 7}, (_, i) => {
        const d = new Date(startOfWeek);
        d.setDate(d.getDate() + i);
        return d;
      });

      let html = `<div class="h-full flex flex-col overflow-y-auto"><div class="grid grid-cols-8 border-b border-slate-200/80 bg-slate-50/80 sticky top-0 z-10 text-center py-2.5 text-xs font-bold text-slate-600"><div class="py-1 text-[10px] uppercase text-slate-400">Hora</div>`;
      const dayNames = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];

      weekDays.forEach((d, idx) => {
        const isToday = formatDate(d) === formatDate(new Date());
        html += `<div class="py-1 ${isToday ? 'bg-blue-100/60 text-blue-700 rounded-xl font-bold' : ''}"><div>${dayNames[idx]}</div><div class="text-base font-extrabold">${d.getDate()}</div></div>`;
      });
      html += `</div>`;

      for (let hour = 7; hour <= 20; hour++) {
        const timeLabel = `${hour.toString().padStart(2, '0')}:00`;
        html += `<div class="grid grid-cols-8 border-b border-slate-100 min-h-[64px]"><div class="p-2 text-[10px] font-bold text-slate-400 text-center border-r border-slate-100 bg-slate-50/30">${timeLabel}</div>`;

        weekDays.forEach(d => {
          const dateStr = formatDate(d);
          const cellEvents = filteredEvents.filter(e => e.date === dateStr && parseInt(e.startTime.split(':')[0]) === hour);

          html += `<div class="border-r border-slate-100 p-1 hover:bg-slate-50/80 transition cursor-pointer" onclick="openNewEventModal('${dateStr}', '${timeLabel}')">`;
          cellEvents.forEach(ev => {
            const style = categoryStyles[ev.category] || categoryStyles['Outros'];
            html += `<div onclick="event.stopPropagation(); showEventDetails('${ev.id}')" class="${style.bg} ${style.text} border-l-4 ${style.border} rounded-lg p-1.5 mb-1 text-xs shadow-2xs hover:shadow-xs transition"><div class="font-bold truncate">${escapeHTML(ev.title)}</div><div class="text-[10px] opacity-80">${escapeHTML(ev.startTime)} - ${escapeHTML(ev.endTime)}</div></div>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
      viewContainer.innerHTML = html;
    }

    function renderDayView(filteredEvents) {
      const dateStr = formatDate(currentDate);
      const dayEvents = filteredEvents.filter(e => e.date === dateStr).sort((a, b) => a.startTime.localeCompare(b.startTime));

      let html = `<div class="h-full flex flex-col p-8 overflow-y-auto max-w-4xl mx-auto"><div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-200/80"><div><h3 class="text-xl font-bold text-slate-900 capitalize">${currentDate.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h3><p class="text-xs text-slate-500 font-medium">${dayEvents.length} compromisso(s) agendado(s)</p></div><button onclick="openNewEventModal('${dateStr}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-xs transition">+ Agendar Novo</button></div>`;

      if (dayEvents.length === 0) {
        html += `<div class="text-center py-20 text-slate-400"><i class="fa-regular fa-calendar-xmark text-5xl mb-3 text-slate-300"></i><p class="text-sm font-semibold">Nenhum compromisso para este dia.</p></div>`;
      } else {
        html += `<div class="space-y-3.5">`;
        dayEvents.forEach(ev => {
          const style = categoryStyles[ev.category] || categoryStyles['Outros'];
          html += `<div onclick="showEventDetails('${ev.id}')" class="bg-white border-l-4 ${style.border} border border-slate-200/80 rounded-2xl p-4 shadow-2xs hover:shadow-md transition cursor-pointer flex items-center justify-between group"><div><div class="flex items-center gap-2 mb-1.5"><span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full ${style.badgeBg} ${style.text}">${escapeHTML(ev.category)}</span><span class="text-xs font-bold text-slate-600"><i class="fa-regular fa-clock mr-1 text-slate-400"></i>${escapeHTML(ev.startTime)} às ${escapeHTML(ev.endTime)}</span></div><h4 class="text-base font-bold text-slate-900 mb-1">${escapeHTML(ev.title)}</h4><div class="text-xs text-slate-500 font-medium">Agendado por: <strong class="text-slate-700">${escapeHTML(ev.createdBy)}</strong></div></div><i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-600 transition"></i></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
      viewContainer.innerHTML = html;
    }

    function renderAgendaView(filteredEvents) {
      const sortedEvents = [...filteredEvents].sort((a, b) => a.date !== b.date ? a.date.localeCompare(b.date) : a.startTime.localeCompare(b.startTime));

      let html = `<div class="h-full p-8 overflow-y-auto max-w-4xl mx-auto"><h3 class="text-lg font-bold text-slate-900 mb-6 pb-3 border-b border-slate-200/80 flex items-center gap-2"><i class="fa-solid fa-list-check text-blue-600"></i> Lista Geral de Compromissos</h3>`;

      if (sortedEvents.length === 0) {
        html += `<div class="text-center py-20 text-slate-400"><i class="fa-solid fa-inbox text-5xl mb-3 text-slate-300"></i><p class="text-sm font-semibold">Nenhum compromisso cadastrado.</p></div>`;
      } else {
        html += `<div class="space-y-3">`;
        sortedEvents.forEach(ev => {
          const style = categoryStyles[ev.category] || categoryStyles['Outros'];
          const dateParts = ev.date.split('-');
          html += `<div onclick="showEventDetails('${ev.id}')" class="bg-white border border-slate-200/80 rounded-2xl p-4 hover:shadow-md transition cursor-pointer flex items-center justify-between group"><div class="flex items-center gap-4"><div class="bg-slate-100/80 rounded-xl p-2.5 text-center min-w-[70px] border border-slate-200/60"><div class="text-xs font-bold text-slate-800">${dateParts[2]}/${dateParts[1]}</div><div class="text-[10px] text-slate-400 font-semibold">${dateParts[0]}</div></div><div><div class="flex items-center gap-2 mb-1"><span class="${style.badgeBg} ${style.text} text-[10px] font-bold px-2 py-0.5 rounded-full">${escapeHTML(ev.category)}</span><span class="text-xs font-semibold text-slate-500">${escapeHTML(ev.startTime)} - ${escapeHTML(ev.endTime)}</span></div><h4 class="text-sm font-bold text-slate-900">${escapeHTML(ev.title)}</h4><span class="text-xs text-slate-500">Agendado por: <strong class="text-slate-700">${escapeHTML(ev.createdBy)}</strong></span></div></div><i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-600 transition"></i></div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
      viewContainer.innerHTML = html;
    }

    function renderMiniCalendar() {
      const year = selectedMiniDate.getFullYear();
      const month = selectedMiniDate.getMonth();
      const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      miniMonthTitle.textContent = `${months[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      let html = '';

      for (let i = 0; i < firstDay; i++) html += `<div></div>`;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = formatDate(new Date(year, month, day));
        const isToday = dateStr === formatDate(new Date());
        const isSelected = dateStr === formatDate(currentDate);

        html += `<button onclick="selectMiniCalendarDate('${dateStr}')" class="h-7 w-7 mx-auto flex items-center justify-center rounded-full text-xs font-semibold ${isToday ? 'bg-blue-600 text-white font-bold shadow-2xs' : ''} ${isSelected && !isToday ? 'bg-blue-100 text-blue-700 font-bold border border-blue-300' : ''} ${!isToday && !isSelected ? 'hover:bg-slate-200/60 text-slate-700' : ''}">${day}</button>`;
      }
      miniCalendarDays.innerHTML = html;
    }

    function navigateMiniMonth(dir) {
      selectedMiniDate.setMonth(selectedMiniDate.getMonth() + dir);
      renderMiniCalendar();
    }

    function selectMiniCalendarDate(dateStr) {
      currentDate = new Date(dateStr + 'T00:00:00');
      renderCurrentView();
    }

    function openNewEventModal(defaultDate = null, defaultStartTime = '09:00') {
      if (!currentUserRole) return;
      document.getElementById('eventId').value = '';
      document.getElementById('inputAgendaOwner').disabled = false;
      document.getElementById('modalTitle').querySelector('span').textContent = 'Agendar Compromisso';
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputDate').value = defaultDate || formatDate(currentDate);
      document.getElementById('inputStartTime').value = defaultStartTime;

      const [h, m] = defaultStartTime.split(':').map(Number);
      document.getElementById('inputEndTime').value = `${(h + 1).toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;

      const activeFilter = document.getElementById('agendaFilter').value;
      document.getElementById('inputAgendaOwner').value = activeFilter === 'lucas' ? 'lucas' : 'savio';
      document.getElementById('inputCreatedBy').value = globalUserNameInput.value || '';
      document.getElementById('inputCategory').value = 'Atendimento';
      document.getElementById('inputDescription').value = '';
      document.getElementById('btnDeleteEvent').classList.add('hidden');
      document.getElementById('eventModal').classList.remove('hidden');
    }

    function closeModal() { 
      document.getElementById('eventModal').classList.add('hidden'); 
    }

    function closeDetailsModal() { 
      document.getElementById('detailsModal').classList.add('hidden'); 
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('eventId').value;
      const eventData = {
        title: document.getElementById('inputTitle').value,
        date: document.getElementById('inputDate').value,
        startTime: document.getElementById('inputStartTime').value,
        endTime: document.getElementById('inputEndTime').value,
        createdBy: id ? (events.find(ev => ev.id === id)?.createdBy || '') : globalUserNameInput.value,
        category: document.getElementById('inputCategory').value,
        description: document.getElementById('inputDescription').value
      };

      try {
        if (id && currentUserRole === 'Diretor') {
          const targetUid = ownerUid(document.getElementById('inputAgendaOwner').value);
          if (!targetUid) throw new Error('Agenda de destino indisponível.');
          eventData.agendaOwnerUid = targetUid;
        }
        await saveEventToStorage(eventData, id || null);
        closeModal();
      } catch (error) { alert('Não foi possível salvar: ' + error.message); }
    }

    function showEventDetails(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;

      currentActiveEvent = ev;
      const style = categoryStyles[ev.category] || categoryStyles['Outros'];

      const badge = document.getElementById('detailCategoryBadge');
      badge.textContent = ev.category;
      badge.className = `text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider mb-3 inline-block ${style.badgeBg} ${style.text}`;

      document.getElementById('detailTitle').textContent = ev.title;
      
      const dateParts = ev.date.split('-');
      document.getElementById('detailDate').textContent = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;
      document.getElementById('detailTime').textContent = `${escapeHTML(ev.startTime)} às ${escapeHTML(ev.endTime)}`;
      document.getElementById('detailCreatedBy').textContent = (ev.createdBy || 'Não informado') + ' · Agenda: ' + (eventOwner(ev)==='savio' ? 'Savio' : 'Lucas');
      
      const descContainer = document.getElementById('detailDescContainer');
      if (ev.description && ev.description.trim() !== '') {
        document.getElementById('detailDescription').textContent = ev.description;
        descContainer.classList.remove('hidden');
      } else {
        descContainer.classList.add('hidden');
      }

      document.getElementById('detailsModal').classList.remove('hidden');
    }

    function editFromDetails() {
      if (!currentActiveEvent) return;
      closeDetailsModal();

      document.getElementById('eventId').value = currentActiveEvent.id;
      document.getElementById('modalTitle').querySelector('span').textContent = 'Editar Compromisso';
      document.getElementById('inputTitle').value = currentActiveEvent.title;
      document.getElementById('inputDate').value = currentActiveEvent.date;
      document.getElementById('inputStartTime').value = currentActiveEvent.startTime;
      document.getElementById('inputEndTime').value = currentActiveEvent.endTime;
      document.getElementById('inputAgendaOwner').value = eventOwner(currentActiveEvent);
      document.getElementById('inputAgendaOwner').disabled = currentUserRole === 'Colaborador';
      document.getElementById('inputCreatedBy').value = currentActiveEvent.createdBy;
      document.getElementById('inputCategory').value = currentActiveEvent.category;
      document.getElementById('inputDescription').value = currentActiveEvent.description || '';

      document.getElementById('btnDeleteEvent').classList.remove('hidden');
      document.getElementById('eventModal').classList.remove('hidden');
    }

    async function deleteFromDetails() {
      if (!currentActiveEvent) return;
      if (confirm('Tem certeza que deseja excluir este agendamento?')) {
        try { await deleteEventFromStorage(currentActiveEvent.id); closeDetailsModal(); }
        catch (error) { alert('Não foi possível continuar: ' + error.message); }
      }
    }

    async function deleteCurrentEvent() {
      const id = document.getElementById('eventId').value;
      if (id && confirm('Tem certeza que deseja excluir este agendamento?')) {
        try { await deleteEventFromStorage(id); closeModal(); }
        catch (error) { alert('Não foi possível continuar: ' + error.message); }
      }
    }
  </script>
</body>
</html>
